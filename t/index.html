<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treino compartilhado · treino.one</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px 18px 48px;font:17px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#06110E;color:#F1F8F4}
main{max-width:560px;margin:0 auto}
.brand{font-weight:800;letter-spacing:-.03em;color:#A7B8AF;font-size:13px;text-transform:uppercase}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 4px}
.meta{color:#A7B8AF;margin-bottom:18px}
.note{background:#0D1B17;border:1px solid #294238;border-radius:16px;padding:14px 16px;margin-bottom:16px;color:#F1F8F4}
.note small{display:block;color:#A7B8AF;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
ol{list-style:none;padding:0;margin:0 0 24px}
li{display:flex;gap:14px;align-items:center;background:#0D1B17;border:1px solid #294238;border-radius:16px;padding:14px 16px;margin-bottom:8px}
.n{width:30px;height:30px;border-radius:50%;background:#14251F;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.name{flex:1}.name small{display:block;color:#A7B8AF}
.spec{font-weight:800;white-space:nowrap}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:800;border-radius:16px;padding:16px;margin-bottom:10px}
.primary{background:#C8F75A;color:#06110E}.secondary{background:#14251F;color:#F1F8F4;border:1px solid #294238}
.err{background:#2b1418;border:1px solid #ff6b70;border-radius:16px;padding:16px}
code{word-break:break-all;color:#A7B8AF;font-size:12px}
</style></head><body><main>
<div class="brand">treino.one</div>
<div id="app"><p class="meta">Carregando treino…</p></div>
</main>
<script>
(function(){
  var GROUPS={chest:"Peito",shoulders:"Ombros",triceps:"Tríceps",back:"Costas",biceps:"Bíceps",quadriceps:"Quadríceps",hamstrings:"Posterior",glutes:"Glúteos",calves:"Panturrilha",core:"Core",cardio:"Cardio"};
  var EQUIP={bodyweight:"Peso do corpo",dumbbell:"Halteres",barbell:"Barra",kettlebell:"Kettlebell",band:"Elásticos",cable:"Polia",machine:"Máquina"};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function decode(code){
    var b64=code.replace(/-/g,"+").replace(/_/g,"/");while(b64.length%4)b64+="=";
    var bin=atob(b64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }
  var app=document.getElementById("app");
  var code=(location.hash||"").replace(/^#/,"").trim();
  if(!code){var m=location.search.match(/[?&]c=([A-Za-z0-9_-]+)/);if(m)code=m[1];}
  if(!code){app.innerHTML='<div class="err">Este link não tem um treino. Peça para quem enviou compartilhar de novo pelo app.</div>';return;}
  var w;try{w=decode(code)}catch(e){app.innerHTML='<div class="err">Não consegui ler este treino. O link pode ter sido cortado ao colar.</div>';return;}
  if(!w||!w.e||!w.e.length){app.innerHTML='<div class="err">Treino vazio ou inválido.</div>';return;}
  var sets=w.e.reduce(function(a,x){return a+(x.s||0)},0);
  var html='<h1>'+esc(w.t||"Treino")+'</h1><p class="meta">'+w.e.length+' exercícios · '+sets+' séries</p>';
  if(w.n)html+='<div class="note"><small>Observação de quem montou</small>'+esc(w.n)+'</div>';
  html+='<ol>';
  w.e.forEach(function(x,i){
    var spec=x.s+' × '+x.r+(x.k===1?'s':'');
    if(x.l&&x.l>0)spec+=' · '+String(x.l).replace('.',',')+' kg';
    html+='<li><span class="n">'+(i+1)+'</span><span class="name">'+esc(x.m)+'<small>'+esc(GROUPS[x.g]||x.g||"")+' · '+esc(EQUIP[x.q]||x.q||"")+'</small></span><span class="spec">'+spec+'</span></li>';
  });
  html+='</ol>';
  html+='<a class="btn primary" href="treino://t?c='+encodeURIComponent(code)+'">Abrir no treino.one</a>';
  html+='<a class="btn secondary" href="https://github.com/KayoSavio/treino.one">Ainda não tem o app? Em breve na Google Play</a>';
  html+='<p class="meta" style="font-size:13px">Se o botão não abrir o app, copie o código abaixo e use “Recebeu um treino?” na tela Hoje.<br><code>'+esc(code)+'</code></p>';
  app.innerHTML=html;
})();
</script>
</body></html>
